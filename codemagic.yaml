workflows:
  android-build:
    name: Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - supabase
      flutter: stable
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - name: Get packages
        working_directory: apps/mobile
        script: flutter pub get
      - name: Analyze
        working_directory: apps/mobile
        script: flutter analyze
      - name: Build APK
        working_directory: apps/mobile
        script: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_KEY=$SUPABASE_PUBLISHABLE_KEY
    artifacts:
      - apps/mobile/build/app/outputs/flutter-apk/*.apk
