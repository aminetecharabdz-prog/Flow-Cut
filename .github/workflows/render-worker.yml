name: Render worker

# Started by the `generate` Supabase function after a job is queued.
# Each run drains the queue, so parallel triggers just wait their turn.
on:
  repository_dispatch:
    types: [render]
  workflow_dispatch:

concurrency:
  group: render-worker
  cancel-in-progress: false

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: engine
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://ukekgjillyhxbiexewpi.supabase.co' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WORKER_ID: gh-${{ github.run_id }}
      MAX_JOBS: '20'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/asr/requirements.txt

      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install -q -r asr/requirements.txt
          npx remotion browser ensure

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the SUPABASE_SERVICE_ROLE_KEY repository secret"; exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set: scenes will be planned by rules instead of Claude"
          fi

      - name: Run worker
        run: npx tsx src/worker.ts
